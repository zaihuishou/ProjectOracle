[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-oracle"
version = "1.0.0"
description = "MCP server for intelligent project analysis and AI-powered documentation generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ProjectOracle Contributors", email = "project-oracle@example.com"}
]
keywords = ["mcp", "code-analysis", "llm", "documentation", "ai", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "pathspec>=0.12.0",
    "anthropic>=0.18.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/zaihuishou/ProjectOracle"
Documentation = "https://github.com/zaihuishou/ProjectOracle#readme"
Repository = "https://github.com/zaihuishou/ProjectOracle"
Issues = "https://github.com/zaihuishou/ProjectOracle/issues"
Changelog = "https://github.com/zaihuishou/ProjectOracle/releases"

[project.scripts]
project-oracle = "project_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
